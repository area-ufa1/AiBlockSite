name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tabguard.keystore"
            echo "TABGUARD_KEYSTORE=$RUNNER_TEMP/tabguard.keystore" >> "$GITHUB_ENV"
          fi
      - name: Test and build
        env:
          TABGUARD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tab-guard-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: cd pc && npm test
      - name: Package
        run: bash pc/scripts/package.sh
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: tab-guard-extension
          path: pc/dist/
