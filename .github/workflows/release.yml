name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TABGUARD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing: the APK would not install over the previous one"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tabguard.keystore"
          echo "TABGUARD_KEYSTORE=$RUNNER_TEMP/tabguard.keystore" >> "$GITHUB_ENV"
      - name: Test and build APK
        env:
          TABGUARD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TabGuard-Android.apk
      - name: Test and package extension
        run: |
          (cd pc && npm test)
          bash pc/scripts/package.sh
          cp pc/dist/TabGuard-PC.zip TabGuard-PC.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TabGuard-Android.apk
            TabGuard-PC.zip
